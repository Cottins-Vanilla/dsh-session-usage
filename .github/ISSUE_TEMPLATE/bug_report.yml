name: Bug report
description: Report a reproducible problem with Session usage.
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first.
        For a security problem, use the private process in SECURITY.md instead
        of this form.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before reporting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce this on the latest 1.0.x release.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      description: For example 0.2.2-rc.1.
      placeholder: 0.2.2-rc.1
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The version shown on the Plugins page or in package.json.
      placeholder: 1.0.0
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Sidebar usage panel
        - Usage View tab
        - Session header chip
        - Turn price badge
        - Price calculation
        - Installation or activation
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest sequence that shows the problem.
      placeholder: |
        1. Open a conversation with at least two turns.
        2. Open the Sidebar → 会话用量 panel.
        3. Select ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Screenshots are welcome, but redact conversation content and paths you do not want to publish.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or console output
      description: Remove tokens, paths, and private conversation text before pasting.
      render: text
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Plugin config
      description: The `config:` block for the session-usage row, with secrets removed.
      render: yaml
    validations:
      required: false
